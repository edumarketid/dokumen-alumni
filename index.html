<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Dokumen Siswa & Alumni</title>
<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- CSS Modular -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SAKLAR / TOMBOL ADMIN DI SUDUT KANAN ATAS -->
<button class="admin-switch" onclick="toggleAdminLogin()" title="Login Admin">⚙️ Admin</button>

<div class="container">
  <!-- HOME -->
  <div id="home" class="card">
    <div class="logo">📚</div>
    <h1>Portal Dokumen</h1>
    <div class="subtitle">Siswa & Alumni Sekolah</div>
    <button class="btn-primary" onclick="showActivation()">Aktivasi Akun Siswa</button>
    <button class="btn-secondary" onclick="showLogin()">Login Siswa</button>
  </div>

  <!-- AKTIVASI SISWA -->
  <div id="activation" class="card hidden">
    <h1>Aktivasi Akun</h1>
    <div class="subtitle">Buat PIN untuk akses dokumen Anda</div>
    <label>Nomor NISN</label>
    <input id="activationNisn" type="text" inputmode="numeric" placeholder="Masukkan NISN">
    <button class="btn-primary" onclick="checkNisn()">Lanjutkan</button>
    <div id="activationResult"></div>
    <button class="btn-secondary" onclick="showHome()">Kembali</button>
  </div>

  <!-- LOGIN SISWA -->
  <div id="login" class="card hidden">
    <h1>Login Siswa</h1>
    <div class="subtitle">Masukkan NISN dan PIN terdaftar</div>
    <label>Nomor NISN</label>
    <input id="loginNisn" type="text" inputmode="numeric" placeholder="Masukkan NISN">
    <label>PIN (6 Digit)</label>
    <input id="loginPin" type="password" inputmode="numeric" maxlength="6" placeholder="******">
    <button class="btn-primary" onclick="doLogin()">Masuk Dashboard</button>
    <div id="loginMessage"></div>
    <button class="btn-secondary" onclick="showHome()">Kembali</button>
  </div>

  <!-- LOGIN ADMIN -->
  <div id="adminLogin" class="card hidden">
    <h1>Login Admin</h1>
    <div class="subtitle">Kelola database & unggah arsip dokumen</div>
    <label>Username Admin</label>
    <input id="adminUser" type="text" value="admin">
    <label>Password Admin</label>
    <input id="adminPass" type="password" placeholder="Password default: 123450">
    <button class="btn-success" onclick="doAdminLogin()">Masuk Panel Admin</button>
    <div id="adminLoginMessage"></div>
    <button class="btn-secondary" onclick="showHome()">Kembali</button>
  </div>

  <!-- DASHBOARD SISWA -->
  <div id="dashboard" class="card hidden">
    <div class="logo" style="font-size: 36px; margin-bottom: 4px;">📂</div>
    <h1>Dokumen Saya</h1>
    <div id="studentName" class="student-name"></div>
    <div id="studentMeta" class="student-info"></div>
    <div id="documents"></div>
    <button class="btn-secondary" onclick="doLogout()">Keluar Akun</button>
  </div>

  <!-- DASHBOARD ADMIN -->
  <div id="adminDashboard" class="card hidden">
    <div class="logo" style="font-size: 36px; margin-bottom: 4px;">⚙️</div>
    <h1>Panel Admin</h1>
    <div class="subtitle">Upload Arsip Siswa & Alumni</div>
    
    <label>Kategori Dokumen (Folder)</label>
    <select id="uploadCategory">
      <option value="Ijazah">Ijazah</option>
      <option value="Transkrip">Transkrip</option>
      <option value="Sertifikat">Sertifikat</option>
      <option value="SKHUN">SKHUN</option>
      <option value="Alumni">Alumni</option>
    </select>

    <label>NISN Target File</label>
    <input id="uploadNisn" type="text" inputmode="numeric" placeholder="Contoh: 0051234567">

    <label>Pilih File (PDF / Gambar)</label>
    <input id="uploadFile" type="file">

    <button class="btn-success" onclick="uploadDocumentByAdmin()">Upload Dokumen</button>
    <div id="uploadMessage"></div>

    <button class="btn-secondary" onclick="doLogout()">Keluar Admin</button>
  </div>
</div>

<div id="loadingMessage">Memproses...</div>

<!-- JS Modular -->
<script src="app.js"></script>
</body>
</html>
